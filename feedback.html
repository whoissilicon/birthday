<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback — A Special Journey</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- CSS (same stylesheet as the main site, so the look matches exactly) -->
  <link rel="stylesheet" href="style.css">

  <!-- EmailJS SDK -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body>

  <div class="app">
    <div class="screen active" id="feedbackScreen">
      <div class="center">
        <a class="back" href="index.html" style="text-decoration: none; display: inline-block;">← Back to the journey</a>

        <span class="badge">YOUR THOUGHTS</span>
        <div class="section-heading center-heading">
          <h1>Leave a Feedback</h1>
          <p>Let me know how everything felt.</p>
        </div>

        <form id="feedbackForm" class="feedback-form-box">
          <div class="input-group">
            <input type="text" id="fbName" placeholder="Your Name" required />
          </div>
          <div class="input-group">
            <input type="email" id="fbEmail" placeholder="Your Email (Optional)" />
          </div>
          <div class="rating-container">
            <p>Rating:</p>
            <div class="stars">
              <span class="star active" data-value="1">★</span>
              <span class="star active" data-value="2">★</span>
              <span class="star active" data-value="3">★</span>
              <span class="star active" data-value="4">★</span>
              <span class="star active" data-value="5">★</span>
            </div>
            <input type="hidden" id="ratingValue" value="5" />
          </div>
          <div class="input-group">
            <textarea id="fbMessage" placeholder="Write your message here..." rows="4" required></textarea>
          </div>
          <button type="submit" class="btn" id="fbSubmitBtn" style="width: 100%;">Send Feedback</button>
        </form>

        <div id="fbSuccess" class="hidden feedback-msg">
          <p class="success-text">✨ Thank you! Your feedback has been sent successfully.</p>
        </div>

        <div id="fbError" class="hidden feedback-msg">
          <p class="error-text">❌ Oops! Something went wrong. Please try again.</p>
        </div>

        <a class="btn secondary hidden" id="restartBtn" href="index.html" style="margin-top: 20px; display: inline-block; text-decoration: none;">Start Over</a>
      </div>
    </div>
  </div>

  <script src="feedback.js"></script>
</body>
</html>
